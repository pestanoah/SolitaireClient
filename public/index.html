<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover exposes env(safe-area-inset-*) so SafeAreaProvider works in iOS standalone mode. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Solitaire</title>
    <meta name="description" content="Classic Klondike Solitaire with Draw 1 / Draw 3, hints, and daily challenges." />

    <!-- PWA: paths are absolute because the app is served from the /SolitaireClient base path (app.json experiments.baseUrl). -->
    <link rel="manifest" href="/SolitaireClient/manifest.json" />
    <meta name="theme-color" content="#064e3b" />
    <link rel="apple-touch-icon" href="/SolitaireClient/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Solitaire" />
    <!--
      Omit apple-mobile-web-app-status-bar-style entirely.
      Specifying `black-translucent` causes WebKit to treat the page as having zero top obscured
      insets (_obscuredInsets.top == 0), permanently forcing iOS's progressive blur over the top
      edge with no way for the page to dismiss it.
      Omitting the tag lets iOS WebKit reserve the top status bar area, pairing with theme-color
      and the #ios-statusbar-anchor element below to hide the progressive blur pocket.
    -->

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        /* Match the felt so standalone launch / overscroll never flashes white. */
        background-color: #064e3b;
      }
      /*
        Fixed element for iOS WebKit standalone status bar color sampler (WebKit LocalFrameView::fixedContainerEdges).
        WebKit requires:
        - Position: fixed at top: 0
        - Border-box height > 10px (thinBorderWidth threshold), so 11px is the exact minimum required
        - background-clip: text on empty div: computed style carries #064e3b for WebKit's sampler
          without painting any visible pixels on screen
        - z-index at top of DOM (2147483647)
        - pointer-events: none to avoid intercepting touches
      */
      #ios-statusbar-anchor {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 11px;
        background-color: #064e3b;
        -webkit-background-clip: text;
        background-clip: text;
        z-index: 2147483647;
        pointer-events: none;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <!--
      Service worker (generated by Workbox in `npm run build:web`) for offline play.
      It only exists in exported builds; registration fails harmlessly on the dev server.
    -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/SolitaireClient/sw.js', { scope: '/SolitaireClient/' })
            .catch(function (error) {
              console.warn('Service worker registration failed:', error);
            });
        });
      }

      /* Force iOS WebKit compositor layer refresh on standalone launch so that
         the status bar color extension anchor is evaluated immediately on app open. */
      if (typeof window !== 'undefined') {
        window.addEventListener('load', function () {
          var isStandalone = (window.navigator && window.navigator.standalone === true) ||
            (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
          var isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
          if (!isStandalone || !isIOS) return;

          var trigger = document.createElement('div');
          trigger.style.cssText = 'position:fixed;top:0;right:0;width:11px;height:11px;z-index:2147483646;opacity:0.01;pointer-events:none;transform:translateZ(0);';
          document.body.appendChild(trigger);
          requestAnimationFrame(function () {
            trigger.style.transform = 'translate3d(1px,0,0)';
            setTimeout(function () {
              if (trigger && trigger.parentNode) {
                trigger.parentNode.removeChild(trigger);
              }
            }, 400);
          });
        });
      }
    </script>
  </head>

  <body>
    <!-- Real DOM anchor element at top: 0 for iOS WebKit status bar color sampler. -->
    <div id="ios-statusbar-anchor" aria-hidden="true"></div>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
