<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover exposes env(safe-area-inset-*) so SafeAreaProvider works in iOS standalone mode. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Solitaire</title>
    <meta name="description" content="Classic Klondike Solitaire with Draw 1 / Draw 3, hints, and daily challenges." />

    <!-- PWA: paths are absolute because the app is served from the /SolitaireClient base path (app.json experiments.baseUrl). -->
    <link rel="manifest" href="/SolitaireClient/manifest.json" />
    <meta name="theme-color" content="#064e3b" />
    <link rel="apple-touch-icon" href="/SolitaireClient/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Solitaire" />
    <!--
      Use an opaque status bar. `black-translucent` draws the page under the status bar, and iOS
      applies a system blur over that top edge in standalone mode, washing out the GameHeader.
      Note: iOS snapshots this at install time, so the PWA must be re-added to see changes.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        /* Match the felt so standalone launch / overscroll never flashes white. */
        background-color: #064e3b;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <!--
      Service worker (generated by Workbox in `npm run build:web`) for offline play.
      It only exists in exported builds; registration fails harmlessly on the dev server.
    -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/SolitaireClient/sw.js', { scope: '/SolitaireClient/' })
            .catch(function (error) {
              console.warn('Service worker registration failed:', error);
            });
        });
      }
    </script>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
